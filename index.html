<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/output.css" />
    <title>To-Do List</title>
  </head>
  <body class="bg-cyan-900 text-white p-5">
    <h1 class="mb-5 text-3xl font-semibold">To-Do List</h1>
    <form id="todo-form" class="">
      <div class="flex gap-2.5">
        <input
          type="text"
          id="new-todo"
          placeholder="Add a new task"
          class="bg-white/90 text-black border border-transparent outline-none p-2 rounded-md focus:border-blue-300"
        />
        <button
          type="submit"
          id="add-todo"
          class="bg-slate-900/80 cursor-pointer p-2 rounded-md"
        >
          Add
        </button>
      </div>
    </form>

    <h2 class="mb-5 mt-5 text-3xl font-semibold">Tareas pendientes</h2>
    <ul
      id="todo-list"
      class="flex flex-col gap-6 mt-5 bg-cyan-950 w-10/12 max-w-250 px-4 py-2.5 rounded-md"
    ></ul>

    <h2 class="mb-5 mt-5 text-3xl text-green-500 font-semibold">
      Tareas Completadas
    </h2>
    <ul
      id="complete-todo-list"
      class="flex flex-col gap-6 mt-5 bg-cyan-950 w-10/12 max-w-250 px-4 py-2.5 rounded-md"
    ></ul>

    <script src="/main.js"></script>
  </body>
</html>
