<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/output.css" />
    <title>To-Do List</title>
  </head>
  <body class="bg-cyan-900 text-white">
    <h1 class="mb-5">To-Do List</h1>
    <form id="todo-form" class="flex flex-col gap-1.5">
      <div>
        <input
          type="text"
          id="new-todo"
          placeholder="Add a new task"
          class="bg-blue-800/30 border border-blue-400 ring-0 p-2"
        />
        <button
          type="submit"
          id="add-todo"
          class="bg-red-800/30 cursor-pointer p-2"
        >
          Add
        </button>
      </div>
    </form>
    <ul id="todo-list"></ul>

    <ul id="complete-todo-list"></ul>

    <script src="/main.js"></script>
  </body>
</html>
